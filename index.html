// 별 타일 캔버스 생성 
function createStarTile(stars) {
  const tile = document.createElement("canvas");
  tile.width = STAR_TILE_SIZE;
  tile.height = STAR_TILE_SIZE;
  const ctx = tile.getContext("2d");
  stars.forEach(s => {
    ctx.beginPath();
    ctx.arc(s.x, s.y, s.r, 0, Math.PI*2);
    ctx.fillStyle = `rgba(255,255,255,${s.alpha})`;
    ctx.fill();
  });
  return tile;
}

// ----------------- [오디오 시스템] -----------------
class AudioManager {
  constructor() {
    this.current = null;
  }

  play(bgm) {
    if (this.current === bgm) return;

    if (this.current) {
      this.current.pause();
      this.current.currentTime = 0;
    }

    this.current = bgm;
    this.current.play();
  }

  stop() {
    if (this.current) {
      this.current.pause();
      this.current.currentTime = 0;
      this.current = null;
    }
  }
}

// ----------------- [함수: 실시간 스탯 계산] -----------------
function getMaxHP(shipData, level){
    const s = shipData.stats;
    return s.baseHP + level * s.hpPerLevel;
}

function getMaxEnergy(shipData, level){
    const s = shipData.stats;
    return s.baseEnergy + level * s.energyPerLevel;
}

function getHPRegenBig(shipData, level){
    return Math.round(getMaxHP(shipData, level) * 0.01);
}

function getHPRegenSmall(shipData, level){
    return Math.round(getMaxHP(shipData, level) * 0.005);
}

function getEnergyRegen(shipData, level){
    return Math.round(getMaxEnergy(shipData, level) * 0.01);
}

// 무게 & 이동속도 & 회전속도 & 크기 함수
function getWeightSum(level){
    return 1 + level / 100;
}

function getMoveSpeed(level){
    return (200 / getWeightSum(level)) + 200;
}

function getAngularSpeed(level){
    return (Math.PI / 2) * (0.5 / getWeightSum(level) + 0.5);
}

function getPlayerScale(level) {
    return 0.5 + level * 0.005;
}

// 관성 수치( 가속, 마찰 )
const ACCEL_START = 300; // Lv1
const ACCEL_END   = 200; // Lv100
const FRICTION_START = 0.99; // Lv1
const FRICTION_END   = 0.995; // Lv100
function lerp(start, end, t) { return start + (end - start) * t; } //선형 변환용
function getPlayerAccel(level) {
    const t = (level - 1) / (MAX_LEVEL - 1);
    return lerp(ACCEL_START, ACCEL_END, t);
}
function getPlayerFriction(level) {
    const t = (level - 1) / (MAX_LEVEL - 1);
    return lerp(FRICTION_START, FRICTION_END, t);
}

// 회전 관성(마찰)
const ROT_FRICTION_START = 0.95; // Lv1
const ROT_FRICTION_END   = 0.98; // Lv100
function getRotFriction(level) {
    const t = (level - 1) / (MAX_LEVEL - 1);
    return lerp(ROT_FRICTION_START, ROT_FRICTION_END, t);
}

// 레벨업 필요 경험치 
function getMaxXP(level) {
    if (level >= MAX_LEVEL) return 114,879; // 더 이상 필요 없음
    return Math.floor(10 * Math.pow(1.1, level - 1)) + 10 * level;
}

// ----------------- [유틸] -----------------
function makeHitBox(cx, cy, w, h){
  return {
    x: cx - w/2,
    y: cy - h/2,
    w,
    h
  };
}

function isInside(mx,my,x,y,w,h){
  return mx>=x && mx<=x+w && my>=y && my<=y+h;
}

function wrap(v,max){return ((v%max)+max)%max;}

function randomOffset(range){
    return (Math.random() * 2 - 1) * range;
}

function wrapIndex(index, max){
  return (index + max) % max;
}

function getDelta(current, prev, size) {
  let delta = current - prev;

  if (delta > size / 2) delta -= size;
  if (delta < -size / 2) delta += size;

  return delta;
}

// 시드 랜덤 함수
function pseudoRandom(x, y) {
  let n = x * 374761393 + y * 668265263; // 큰 소수
  n = (n ^ (n >> 13)) * 1274126177;
  return ((n ^ (n >> 16)) >>> 0) / 4294967295;
}

function getAsteroidIndex(tileX, tileY) {
  const r = pseudoRandom(tileX, tileY);
  const r2 = pseudoRandom(tileX + 999, tileY + 999);
  return Math.floor( ((r + r2) % 1) * 5 );
}

// 효과음 재생
function playSFX(audio, volume = 1, playbackRate = 1) {
  if (!audioUnlocked) return;

  const finalVolume = volume * sfxVolume;

  const sound = audio.cloneNode();
  sound.volume = Math.max(0, Math.min(1, finalVolume));
  sound.playbackRate = playbackRate;
  sound.play();
}

// 상대속도
function getRelativeSpeed(a, b){
  const avx = a.vx ?? 0;
  const avy = a.vy ?? 0;
  const bvx = b.vx ?? 0;
  const bvy = b.vy ?? 0;

  const rvx = avx - bvx;
  const rvy = avy - bvy;

  return Math.hypot(rvx, rvy);
}





// ----------------- [함수: 음향 슬라이더] -----------------
function updateSliderValue(slider, mouseX){

  const { x, w } = slider.hitBox;

  let value = (mouseX - x - px(20)) / (w - px(40));
  value = Math.max(0, Math.min(1, value));

  slider.value = value;

  if (slider === sliders.bgm){
    bgmVolume = value;

    // bgm 크기에 반영
    lobbyBGM.volume = bgmVolume;
    gameBGM.volume = bgmVolume;

  } else {
    sfxVolume = value;
  }
}





// ----------------- [함수: 시야 조절] -----------------
const FOV_MIN = 0.5;   // 최소 시야(넓게)
const FOV_MAX = 2;    // 최대 시야(좁게)

// ----- 변환 함수

// t -> FOV
function sliderToFov(t){
    return FOV_MIN * Math.pow(FOV_MAX / FOV_MIN, t);
}

// FOV -> t (슬라이더 위치)
function fovToSlider(fov){
    return Math.log(fov / FOV_MIN) / Math.log(FOV_MAX / FOV_MIN);
}

// ----- 시야 업데이트
function updateFov(t){
    const fov = sliderToFov(t);

    currentFOV = fov;
    fovSlider.value = t;
    fovLabel.textContent = `X${fov.toFixed(2)}`;
}

// ----- 플레이어 생성 함수
function createPlayer(shipId, level) {
    const shipData = PLAYER_SHIPS[shipId];
    const scale = getPlayerScale(level);

    const player = {
        type: "player",

        name: "",
        shipId,
        shipData,

        level,
        damage: 10,
        hp: getMaxHP(shipData, level),
        energy: getMaxEnergy(shipData, level),
        xp: 0,
        credit: 0,

        x: MAP_SIZE / 2,
        y: MAP_SIZE / 2,
        moveAngle: Math.PI * 1.5,

        weight: getWeightSum(level),

        speed: getMoveSpeed(level),
        vx: 0, vy: 0,
        mvX: 0, mvY: 0,

        MaxAngV: getAngularSpeed(level),
        angularVelocity: 0,

        scale,
        drawR: shipData.baseDrawR * scale,
        hitR:  shipData.baseHitR  * scale,

        weapons: [],

        hitTime: 0,

        engineState: {},

        inputState: {
            forward: false,
            backward: false,
            rotateLeft: false,
            rotateRight: false
        }
    };

    // 엔진 상태 초기화
    if (shipData.engines) {
        for (const eng of shipData.engines) {
            player.engineState[eng.id] = {
                active: false,
                power: 0,
                seed: Math.random() * 1000
            };
        }
    }

    // 대포 추가
    if (shipData.weaponMounts) {
        for (const mount of shipData.weaponMounts) {
            player.weapons.push(
                createWeapon(mount)
            );
        }
    }

    return player;
}





// ----------------- [함수: 이동모드] -----------------
function getMoveMode(input) {
    if (input.forward) {
        if (input.rotateLeft) return MoveMode.FORWARD_LEFT;
        if (input.rotateRight) return MoveMode.FORWARD_RIGHT;
        return MoveMode.FORWARD;
    }

    if (input.backward) {
        if (input.rotateLeft) return MoveMode.BACKWARD_RIGHT;
        if (input.rotateRight) return MoveMode.BACKWARD_LEFT;
        return MoveMode.BACKWARD;
    }

    if (input.rotateLeft) return MoveMode.ROTATE_LEFT;
    if (input.rotateRight) return MoveMode.ROTATE_RIGHT;

    return MoveMode.IDLE;
}





// ----------------- 청크 초기화 -----------------
let chunks = [];
for(let x=0;x<NUM_CHUNKS;x++){
  chunks[x] = [];
  for(let y=0;y<NUM_CHUNKS;y++){
    chunks[x][y] = { x, y, active:false, bullets:[], enemies:[], xps:[], needsUpdate:true};
  }
}

// ----------------- 청크 관리 함수 -----------------
function getChunkIndex(x,y){
    let cx = Math.floor(x/CHUNK_SIZE);
    let cy = Math.floor(y/CHUNK_SIZE);
    cx = wrap(cx,NUM_CHUNKS);
    cy = wrap(cy,NUM_CHUNKS);
    return {cx, cy};
}

function getActiveChunks(player){
    const px = Math.floor(player.x/CHUNK_SIZE);
    const py = Math.floor(player.y/CHUNK_SIZE);
    let activeChunks = [];
    for(let dx=-1;dx<=1;dx++){
        for(let dy=-1;dy<=1;dy++){
            let cx = wrap(px+dx,NUM_CHUNKS);
            let cy = wrap(py+dy,NUM_CHUNKS);
            const chunk = chunks[cx][cy];
            chunk.active=true;
            chunk.needsUpdate=true;
            activeChunks.push(chunk);
        }
    }
    for(let x=0;x<NUM_CHUNKS;x++){
      for(let y=0;y<NUM_CHUNKS;y++){
        if(!activeChunks.includes(chunks[x][y])){
          chunks[x][y].active=false;
        }
      }
    }
    return activeChunks;
}

function removeFromChunk(chunk, obj){
    if(obj.type === "bullet") chunk.bullets = chunk.bullets.filter(b => b !== obj);
    else if(obj.type === "enemy") chunk.enemies = chunk.enemies.filter(e => e !== obj);
}

function addToChunk(chunk, obj){
    if(obj.type === "bullet") chunk.bullets.push(obj);
    else if(obj.type === "enemy") chunk.enemies.push(obj);
}

// ----------------- 엔진 상태 업데이트 함수 -----------------
function updateEngineState(player, delta) {
    const ship = player.shipData;
    if (!ship || !ship.engines) return;

    const mode = getMoveMode(player.inputState);

    for (const eng of ship.engines) {
        const state = player.engineState[eng.id];

        const shouldOn =
            eng.activeOn &&
            eng.activeOn.includes(mode);

        const targetPower = shouldOn ? 1 : 0;

        state.power += (targetPower - state.power) * 10 * delta;

        if (state.power < 0.01) state.power = 0;
        if (state.power > 1) state.power = 1;

        state.active = state.power > 0;
    }
}

// ----------------- 엔진 효과음 제어 함수 -----------------
function updateEngineSound(player, delta) {

  const mode = getMoveMode(player.inputState);

  let targetVolume = 0;

  if (
    mode === MoveMode.FORWARD ||
    mode === MoveMode.FORWARD_LEFT ||
    mode === MoveMode.FORWARD_RIGHT
  ) {
    targetVolume = 1.0;    // 전진 효과음 세기 1.0
  }
  else if (mode !== MoveMode.IDLE) {
    targetVolume = 0.5;    // 그 외 효과음 세기 0.5
  }
  else {
    targetVolume = 0;
  }

  engineSFXVolumeTarget = targetVolume;

  // 효과음 시작
  if (!engineSFXPlaying && targetVolume > 0) {
    engineSFX.volume = 0;
    engineSFX.play();
    engineSFXPlaying = true;
  }

  const fadeSpeed = 2.5; // 페이드 강도
  engineSFX.volume += ((engineSFXVolumeTarget * sfxVolume) - engineSFX.volume) * fadeSpeed * delta;

  // 효과음 종료
  if (engineSFXPlaying && engineSFX.volume < 0.01 && targetVolume === 0) {
    engineSFX.pause();
    engineSFX.currentTime = 0;
    engineSFXPlaying = false;
  }
}

// --- (게임오버 시) 엔진 효과음 끄기
function stopEngineSound() {
  if (!engineSFXPlaying) return;

  engineSFX.pause();
  engineSFX.currentTime = 0;
  engineSFX.volume = 0;

  engineSFXPlaying = false;
  engineSFXVolumeTarget = 0;
}

        sfx,
        0.9 + Math.random() * 0.1,
        0.9 + Math.random() * 0.2
      );
    }

    // 총알 생성
    const angle = player.moveAngle + weapon.angleOffset;

    const cos = Math.cos(player.moveAngle);
    const sin = Math.sin(player.moveAngle);

    const wx = weapon.offset.x;
    const wy = weapon.offset.y;

    const worldX = player.x + wx * cos - wy * sin;
    const worldY = player.y + wx * sin + wy * cos;

    const offset = player.hitR + cannon.bullet.radius + 2;

    const bx = worldX + Math.cos(angle) * offset;
    const by = worldY + Math.sin(angle) * offset;

    const bullet = {

        x: bx,
        y: by,

        angle: angle,

        r: cannon.bullet.radius,
        drawR: cannon.bullet.drawR,
        sprite: cannon.bullet.sprite,

        speed: cannon.bullet.speed,
        lifeTime: cannon.bullet.maxDistance / cannon.bullet.speed,

        damage: cannon.bullet.damage,
        hp: cannon.bullet.hp,

        vx: 0,
        vy: 0,

        type: "bullet",
        hitTime: 0,

        weight: cannon.bullet.bulletWeight,

        spawnTime: performance.now()

    };

    const { cx, cy } = getChunkIndex(bx, by);
    chunks[cx][cy].bullets.push(bullet);

    // 반발 적용
    const recoilTot = cannon.recoil / player.weight;

    player.mvX -= Math.cos(angle) * recoilTot;
    player.mvY -= Math.sin(angle) * recoilTot;

}

// ----------------- 총알 발사 -----------------
function shoot() {
    const now = Date.now();

    for (const weapon of player.weapons) {

        const cannon = weapon.cannon;

        if (now - weapon.lastShot < cannon.fire.fireDelay) continue;
        if (player.energy < cannon.fire.energyCost) continue;

        weapon.lastShot = now;
        player.energy -= cannon.fire.energyCost;
        lastEnergyUseTime = now;

        fireWeapon(weapon);
    }
}

// ----------------- 적 생성 (0. 도형) -----------------
  // 초반 생성 부스트( 15초간 10배 많이 )
function getSpawnMultiplier() {
    if (gameTime < 15) return 10;
    return 1;
}

  // 적 랜덤 정하기
function getRandomEnemyType() {
    const total = ENEMY_TYPES.reduce((sum, t) => sum + t.chance, 0);
    let r = Math.random() * total;

    for (const type of ENEMY_TYPES) {
        r -= type.chance;
        if (r <= 0) return type;
    }
}
  // 적 생성
function spawnEnemy(){
    const type = getRandomEnemyType();
    let ex,ey;
    do { 
        ex=Math.random()*MAP_SIZE; 
        ey=Math.random()*MAP_SIZE; 
    } while(Math.hypot(ex-player.x,ey-player.y)<200);

    const {cx,cy} = getChunkIndex(ex,ey);
    const chunk = chunks[cx][cy];

    if(chunk.enemies.length >= MAX_ENEMIES_PER_CHUNK) return;

    const enemy = {
        x:ex,y:ey,
        shape:type.shape,r:type.size,color:type.color,
        hp:type.hp,damage:type.damage,xp:type.xp,
        type:"enemy",vx:0,vy:0,weight:type.weight,hitTime:0
    };
    chunk.enemies.push(enemy);
}

// ----------------- 경험치 생성 -----------------
function spawnXP(x, y, r, value){ // 얘 말고 아래 진짜 함수 사용
    x = wrap(x, MAP_SIZE);
    y = wrap(y, MAP_SIZE);
    const xp = {
        x, y,
        r,
        value,
        bornTime: Date.now(),
        type: "xp"
    };

    const {cx, cy} = getChunkIndex(x, y);
    chunks[cx][cy].xps.push(xp);
}

function RealSpawnXP(e, XP, RANGE){ // e = 사망자 정보, XP = 생성할 경험치량, RANGE = 생성할 범위
    const px = e.x;
    const py = e.y;

    let totalXP = XP;

    // 50짜리부터 생성
    while(totalXP >= 50){
        spawnXP(
            px + randomOffset(RANGE),
            py + randomOffset(RANGE),
            7, 50
        );
        totalXP -= 50;
    }

    // 10짜리 생성
    while(totalXP >= 10){
        spawnXP(
            px + randomOffset(RANGE),
            py + randomOffset(RANGE),
            5, 10
        );
        totalXP -= 10;
    }
}

// ----------------- 토러스 보정 -----------------
function getWrappedPositions(obj){
    const BORDER_RANGE = Math.max(canvas.width,canvas.height)*0.6;
    const positions = [{x:obj.x,y:obj.y}];
    const nearBorder=obj.x<BORDER_RANGE || obj.x>MAP_SIZE-BORDER_RANGE || obj.y<BORDER_RANGE || obj.y>MAP_SIZE-BORDER_RANGE;
    if(nearBorder){
        const offsets=[[MAP_SIZE,0],[-MAP_SIZE,0],[0,MAP_SIZE],[0,-MAP_SIZE],
                       [MAP_SIZE,MAP_SIZE],[-MAP_SIZE,-MAP_SIZE],[MAP_SIZE,-MAP_SIZE],[-MAP_SIZE,MAP_SIZE]];
        offsets.forEach(([dx,dy])=>positions.push({x:obj.x+dx,y:obj.y+dy}));
    }
    return positions;
}

function drawWrapped(x,y,drawFunc){
    const positions = getWrappedPositions({x,y});
    positions.forEach(p=>{
        drawFunc(p.x, p.y);
    });
}

// --- (충돌)효과음
function handleCollisionSound(a, b){
  const isAPlayer = (a === player);
  const isBPlayer = (b === player);

  if (!isAPlayer && !isBPlayer) return;

  // 플레이어 / 상대 분리
  const other = isAPlayer ? b : a;

  // [XP: 무음]
  if (other.type === "xp") return;

  // [총알: 총알충돌 효과음]
  if (other.type === "bullet") {
    const relSpeed = getRelativeSpeed(a, b);

    // 너무 약한 충돌 무시
    if (relSpeed < 20) return;
    let finalVolume = (relSpeed / 2000 + 0.1) * sfxVolume;  // 속도 비례 + 크기조절(설정)
    finalVolume *= 0.9 + Math.random() * 0.1;  // 크기 랜덤성 (자연스럽게)

    let volume = Math.min(1, finalVolume);

    const sound = bulletHitSFX.cloneNode();
    sound.volume = volume;
    sound.playbackRate = 0.9 + Math.random() * 0.2;  // 길이 랜덤성
    sound.play();

    return;
  }

  // [그 외: 기본충돌 효과음] (적, 플레이어 등)
  const relSpeed = getRelativeSpeed(a, b);

  // 너무 약한 충돌 무시
  if (relSpeed < 40) return;
  let finalVolume = (relSpeed / 300) * sfxVolume;  // 속도 비례 + 크기조절(설정)
  finalVolume *= 0.9 + Math.random() * 0.1;  // 크기 랜덤성

  let volume = Math.min(1, finalVolume);

  const sound = collisionSFX.cloneNode();
  sound.volume = volume;
  sound.playbackRate = 0.9 + Math.random() * 0.2;  // 길이 랜덤성
  sound.play();
}

// --- (충돌)로직
function handleAllCollisions(delta){
    const activeObjects = [];
    for(const row of chunks){
        for(const chunk of row){
            if(!chunk.active) continue;
            activeObjects.push(...chunk.enemies, ...chunk.bullets);
        }
    }
    activeObjects.push(player);

    const getRadius = obj => obj === player ? player.hitR : (obj.r || 0);

    for(let i=0; i<activeObjects.length; i++){
        const a = activeObjects[i];
        if(a.hp <= 0) continue;

        for(let j=i+1; j<activeObjects.length; j++){
            const b = activeObjects[j];
            if(b.hp <= 0) continue;

            const dx = b.x - a.x;
            const dy = b.y - a.y;
            const dist = Math.hypot(dx, dy);

            if(dist <= getRadius(a) + getRadius(b)){
                // 효과음
                handleCollisionSound(a, b);

                // 데미지 처리
                if(a.damage != null) b.hp = Math.max(0, b.hp - a.damage);
                if(b.damage != null) a.hp = Math.max(0, a.hp - b.damage);

                // 히트 이펙트
                if(a.hitTime != null) a.hitTime = HIT_EFFECT_FRAMES;
                if(b.hitTime != null) b.hitTime = HIT_EFFECT_FRAMES;

                // 넉백
                const nx = dx / (dist || 1);
                const ny = dy / (dist || 1);

                let aWeight = (a === player) ? 1.5 * player.weight : a.weight || 10;
                let bWeight = (b === player) ? 1.5 * player.weight : b.weight || 10;

                if(a.vx != null){
                    a.vx -= nx * (knockbackStrength / aWeight);
                    a.vy -= ny * (knockbackStrength / aWeight);
                }
                if(b.vx != null){
                    b.vx += nx * (knockbackStrength / bWeight);
                    b.vy += ny * (knockbackStrength / bWeight);
                }

                // 청크 업데이트
                const {cx:acx, cy:acy} = getChunkIndex(a.x, a.y);
                const {cx:bcx, cy:bcy} = getChunkIndex(b.x, b.y);
                chunks[acx][acy].needsUpdate = true;
                chunks[bcx][bcy].needsUpdate = true;
            }
        }
    }

    // 총알/적 제거 & XP 스폰
    for(const row of chunks){
        for(const chunk of row){
            chunk.bullets = chunk.bullets.filter(b => b.hp > 0);  // 죽은 총알 제거
            chunk.enemies.forEach(e => {
                if(e.hp <= 0 && !e.dead){
                    e.dead = true;
                    // 적(0. 도형) 죽으면 경험치 스폰
                    if(e.type === "enemy"){
                        RealSpawnXP(e, e.xp, e.r);
                    }
                }
            });
            chunk.enemies = chunk.enemies.filter(e => e.hp > 0);  // 죽은 적(0. 도형) 제거
        }
    }
}

// ----------------- [업데이트] -----------------
function update(){
    const now=performance.now();
    let delta=(now-lastTime)/1000;
    lastTime=now;
    delta = Math.min(delta, 0.05); // 델타 클램프

    // 게임 시간 갱신 ----------
    gameTime += delta;

    // 실시간 스탯 갱신 ----------
    const MAX_HP = getMaxHP(player.shipData, player.level);
    const MAX_ENERGY = getMaxEnergy(player.shipData, player.level);
    player.scale = getPlayerScale(player.level);
    player.drawR = player.shipData.baseDrawR * player.scale;
    player.hitR  = player.shipData.baseHitR  * player.scale;
    player.weight = getWeightSum(player.level);
    player.speed = getMoveSpeed(player.level);
    player.MaxAngV = getAngularSpeed(player.level);

    // 플레이어 이동 ----------
    if (!isGameOver) {

        const PLAYER_ACCEL    = getPlayerAccel(player.level);
        const PLAYER_FRICTION = getPlayerFriction(player.level);

        const ROT_ACCEL = player.MaxAngV * 2;  // 회전 가속도 (rad/sec^2)
        const ROT_FRICTION = getRotFriction(player.level); // 키를 떼면 회전 감속 비율

        // A / D : 가속 회전
        if(keys.a) player.angularVelocity -= ROT_ACCEL * delta;
        if(keys.d) player.angularVelocity += ROT_ACCEL * delta;

        // 최고 회전 속도 제한
        if(player.angularVelocity > player.MaxAngV * player.shipData.rotStat) player.angularVelocity = player.MaxAngV * player.shipData.rotStat;
        if(player.angularVelocity < -player.MaxAngV * player.shipData.rotStat) player.angularVelocity = -player.MaxAngV * player.shipData.rotStat;

        // 키를 안 누르면 감속
        if(!keys.a && !keys.d) player.angularVelocity *= Math.pow(ROT_FRICTION, delta * 60);

        // 회전 적용
        player.moveAngle += player.angularVelocity * delta;
        player.moveAngle %= Math.PI * 2;

        // 바라보는 방향 벡터
        const dirX = Math.cos(player.moveAngle);
        const dirY = Math.sin(player.moveAngle);

        // 입력 및 계수 설정
        let input     = 0;
        let speedMul  = 1;

        if (keys.w) {
            input = 1;              // 전진
        } 
        else if (keys.s) {
            input    = -1;          // 후진
            speedMul = player.shipData.reverseSpeedRatio;         // 후진 속도 비율 50%
        }

        // 가속 / 감속
        if (input !== 0) {
            player.vx += dirX * input * PLAYER_ACCEL * speedMul * delta;
            player.vy += dirY * input * PLAYER_ACCEL * speedMul * delta;
        } else {
            player.vx *= Math.pow(PLAYER_FRICTION, delta * 60);
            player.vy *= Math.pow(PLAYER_FRICTION, delta * 60);
        }

        // 최대 속도 제한
        const maxSpeed = player.speed * speedMul * player.shipData.speedStat;
        const speed    = Math.hypot(player.vx, player.vy);

        if (speed > maxSpeed) {
            player.vx = (player.vx / speed) * maxSpeed;
            player.vy = (player.vy / speed) * maxSpeed;
        }

        // 위치 이동
        player.x += player.vx * delta;
        player.y += player.vy * delta;

        // 키데이터 저장
        player.inputState.forward = keys.w;
        player.inputState.backward = keys.s;
        player.inputState.rotateLeft = keys.a;
        player.inputState.rotateRight = keys.d;

        // 엔진 상태& 효과음 업데이트
        updateEngineState(player, delta);
        updateEngineSound(player, delta);
    }

    // 반동 이동
    player.x += player.mvX;
    player.y += player.mvY;
    player.mvX *= Math.pow(RECOIL_DRAG, delta*60);
    player.mvY *= Math.pow(RECOIL_DRAG, delta*60);

    // 플레이어 위치 갱신(토러스/ wrap처리)
    player.x=wrap(player.x,MAP_SIZE);
    player.y=wrap(player.y,MAP_SIZE);

    // 적 생성
    const multiplier = getSpawnMultiplier();
    const spawnInterval = RESPAWN_TIME / multiplier;

    if(Date.now() - lastSpawn > spawnInterval){
        spawnEnemy();
        lastSpawn = Date.now();
    }

    // 활성 청크 업데이트
    const activeChunks = getActiveChunks(player);

    // 청크 업데이트(경험치)
    activeChunks.forEach(chunk=>{
        chunk.xps = chunk.xps.filter(xp=>{
            if(Date.now() - xp.bornTime > XP_LIFE_TIME){
                return false;
            }
            if(Math.hypot(xp.x - player.x, xp.y - player.y) <= xp.r + player.hitR + 50){
                player.xp += xp.value;
                return false;
            }
            return true;
        });
    });

    // 청크 업데이트(적, 총알) - 이동
    activeChunks.forEach(chunk=>{
        // 총알
        chunk.bullets.forEach(b=>{
            const oldChunk = getChunkIndex(b.x, b.y);  // 이동 전 청크
            // 이동
            const moveDist = b.speed * delta;
            b.x += Math.cos(b.angle)*moveDist + b.vx;
            b.y += Math.sin(b.angle)*moveDist + b.vy;
            b.vx *= Math.pow(KNOCKBACK_DRAG, delta*60);
            b.vy *= Math.pow(KNOCKBACK_DRAG, delta*60);
            b.lifeTime -= delta;
            if(b.lifeTime <= 0) b.hp = 0;
            if(b.hitTime>0) b.hitTime-=delta;

            // 토러스wrap처리
            b.x = wrap(b.x, MAP_SIZE);
            b.y = wrap(b.y, MAP_SIZE);

            const newChunk = getChunkIndex(b.x, b.y);  // 이동 후 청크
            if(oldChunk.cx !== newChunk.cx || oldChunk.cy !== newChunk.cy){
                removeFromChunk(chunks[oldChunk.cx][oldChunk.cy], b);
                addToChunk(chunks[newChunk.cx][newChunk.cy], b);
            }
        });

        // 적(0. 도형)
        chunk.enemies.forEach(e=>{
            const oldChunk = getChunkIndex(e.x, e.y);  // 이동 전 청크
            // 이동
            e.x += e.vx;
            e.y += e.vy;
            e.vx *= Math.pow(KNOCKBACK_DRAG, delta*60);
            e.vy *= Math.pow(KNOCKBACK_DRAG, delta*60);
            if(e.hitTime>0) e.hitTime-=delta;

            // 토러스wrap처리
            e.x = wrap(e.x, MAP_SIZE);
            e.y = wrap(e.y, MAP_SIZE);

            const newChunk = getChunkIndex(e.x, e.y);  // 이동 후 청크
            if(oldChunk.cx !== newChunk.cx || oldChunk.cy !== newChunk.cy){
                removeFromChunk(chunks[oldChunk.cx][oldChunk.cy], e);
                addToChunk(chunks[newChunk.cx][newChunk.cy], e);
            }
        });
    });

    if(player.hitTime>0) player.hitTime-=delta;

    handleAllCollisions(delta);

    // 총알 발사
    if(!isGameOver && canShoot()){
        shoot();
    }

    // 플레이어 현재 상태 처리 ----------
    // 자동 회복
    const nowMs = Date.now();

    const HP_REGEN_BIG = getHPRegenBig(player.shipData, player.level);
    const HP_REGEN_SMALL = getHPRegenSmall(player.shipData, player.level);
    const ENERGY_REGEN = getEnergyRegen(player.shipData, player.level);

    if (nowMs - lastRegenTick >= 500) {
        lastRegenTick = nowMs;

        // 체력 회복 
        if (player.hp < MAX_HP && player.energy > 0) {
            const energyRatio = player.energy / MAX_ENERGY;

            // 에너지 90% 이상
            if (
                energyRatio >= 0.9 &&
                player.energy >= HP_REGEN_BIG
            ) {
                player.energy -= HP_REGEN_BIG;
                player.hp += HP_REGEN_BIG;
            }
            // 에너지 < 90% && 에너지 >= 체력 * 2
            else if (
                energyRatio < 0.9 &&
                player.energy >= player.hp * 2 &&
                player.energy >= HP_REGEN_BIG
            ) {
                player.energy -= HP_REGEN_BIG;
                player.hp += HP_REGEN_BIG;
            }
            // 에너지 >= 체력 && < 체력 * 2
            else if (
                energyRatio < 0.9 &&
                player.energy >= player.hp &&
                player.energy < player.hp * 2 &&
                player.energy >= HP_REGEN_SMALL
            ) {
                player.energy -= HP_REGEN_SMALL;
                player.hp += HP_REGEN_SMALL;
            }
        }

        // 에너지 회복 
        if (nowMs - lastEnergyUseTime >= 3000) {
            player.energy += ENERGY_REGEN;
        }
    }

    // 레벨업 처리
    while(player.level < MAX_LEVEL && player.xp >= getMaxXP(player.level)){
        player.xp -= getMaxXP(player.level);
        player.level += 1;
        player.credit += 1; // 레벨업 시 크레딧 증가
    }

    // 클램프(최대/최소)
    player.hp = Math.max(0, Math.min(MAX_HP, player.hp));
    if(player.hp <= 0){
        triggerGameOver();
    }

    player.energy = Math.max(0, Math.min(MAX_ENERGY, player.energy));
    player.xp = Math.max(0, Math.min(getMaxXP(player.level), player.xp));
}

// --- 기준 해상도
const BASE_W = 1357;
const BASE_H = 956;

// --- 스케일 변환
let SCALE = 1;

function updateScale(){
  const scaleX = canvas.width / BASE_W;
  const scaleY = canvas.height / BASE_H;
  SCALE = Math.min(scaleX, scaleY);
}

function px(x){
  return x * SCALE;
}


// --- 공용 그리기
function drawUI(img, ui, cx, cy, localScale = 1.3){
  const sw = ui.w * TILE;
  const sh = ui.h * TILE;

  const finalScale = localScale * SCALE;

  const dw = sw * finalScale;
  const dh = sh * finalScale;

  // 중심 -> 좌상단 변환
  const dx = cx - dw / 2;
  const dy = cy - dh / 2;

  ctx.drawImage(
    img,
    ui.x * TILE,
    ui.y * TILE,
    sw,
    sh,
    dx,
    dy,
    dw,
    dh
  );
}


// --- 로비 배경
function drawLobbyBackground() {
  // 원본 크기
  const sw = UI.lobbyBG.w * TILE;
  const sh = UI.lobbyBG.h * TILE;

  // 화면 너비 기준으로 스케일
  const scale = (canvas.width / BASE_W) * 1.0;

  const dw = sw * scale;
  const dh = sh * scale;

  // 중앙 기준
  const centerX = canvas.width / 2;
  const centerY = canvas.height / 2;

  const startX = centerX - dw / 2;
  const startY = centerY - dh / 2;

  // 몇 번 반복해야 화면 채우는지
  const cols = Math.ceil(canvas.width / dw) + 2;
  const rows = Math.ceil(canvas.height / dh) + 2;

  for (let i = -Math.floor(cols / 2); i <= Math.floor(cols / 2); i++) {
    for (let j = -Math.floor(rows / 2); j <= Math.floor(rows / 2); j++) {

      const dx = startX + i * dw;
      const dy = startY + j * dh;

      ctx.drawImage(
        uiSprite,
        UI.lobbyBG.x * TILE,
        UI.lobbyBG.y * TILE,
        sw,
        sh,
        dx,
        dy,
        dw,
        dh
      );
    }
  }
}

      ship.sheet.sx,

      ctx.fillRect(cx - px(190), cy - px(115), px(380), px(230));

}

// -- 기본배경 레이어 그리기
function drawBasicLayer() {
  const bgX = (player.x - HALF_MAP) * BG_PARALLAX + BG_WORLD_SIZE / 2;
  const bgY = (player.y - HALF_MAP) * BG_PARALLAX + BG_WORLD_SIZE / 2;

  const offsetX = player.x - bgX;
  const offsetY = player.y - bgY;

  const halfW = canvas.width / 2 / currentFOV;
  const halfH = canvas.height / 2 / currentFOV;

  const tileSize = BG_RENDER_TILE_SIZE;

  const startX = Math.floor((player.x - halfW - offsetX) / tileSize) * tileSize;
  const startY = Math.floor((player.y - halfH - offsetY) / tileSize) * tileSize;
  const endX = player.x + halfW - offsetX;
  const endY = player.y + halfH - offsetY;

  for (let x = startX; x < endX; x += tileSize) {
    for (let y = startY; y < endY; y += tileSize) {

      const wrappedX = wrap(x, BG_WORLD_SIZE);
      const wrappedY = wrap(y, BG_WORLD_SIZE);

      const tileX = Math.floor(wrappedX / tileSize);
      const tileY = Math.floor(wrappedY / tileSize);

      const index = tileY * BG_TILES_PER_ROW + tileX;
      const img = bgImages[index];

      const drawX = x + offsetX;
      const drawY = y + offsetY;

      ctx.drawImage(img, drawX, drawY, tileSize + 1, tileSize + 1);
    }
  }
}

// -- 별 레이어 그리기
function drawStarLayer() {
  const halfW = canvas.width / 2 / currentFOV;
  const halfH = canvas.height / 2 / currentFOV;

  const layers = [
    { tile: farTile, parallax: FAR_STAR_PARALLAX },
    { tile: midTile, parallax: MID_STAR_PARALLAX },
    { tile: nearTile, parallax: NEAR_STAR_PARALLAX }
  ];

  layers.forEach(layer => {

    const offsetX = starOffsetX * (1 - layer.parallax);
    const offsetY = starOffsetY * (1 - layer.parallax);

    const startX = Math.floor((player.x - halfW - offsetX) / STAR_TILE_SIZE) * STAR_TILE_SIZE;
    const startY = Math.floor((player.y - halfH - offsetY) / STAR_TILE_SIZE) * STAR_TILE_SIZE;

    const endX = player.x + halfW - offsetX;
    const endY = player.y + halfH - offsetY;

    for (let x = startX; x <= endX; x += STAR_TILE_SIZE) {
      for (let y = startY; y <= endY; y += STAR_TILE_SIZE) {

        ctx.drawImage(
          layer.tile,
          x + offsetX,
          y + offsetY,
          STAR_TILE_SIZE,
          STAR_TILE_SIZE
        );
      }
    }
  });
}

// 미니 체력바
function drawMiniHealthBar(x, y, r, hp, maxHp) {
    hp=Math.max(0,hp);
    if(hp>=maxHp) return;
    const barWidth=r*2;
    const barHeight=5;
    const ratio=hp/maxHp;
    const green=Math.floor(255*ratio);
    const red=255-green;
    ctx.lineWidth=1;
    ctx.strokeStyle="gray";
    ctx.fillStyle="#333";
    ctx.fillRect(x-barWidth/2,y+r+5,barWidth,barHeight);
    ctx.fillStyle=`rgb(${red},${green},0)`;
    ctx.fillRect(x-barWidth/2,y+r+5,barWidth*ratio,barHeight);
    ctx.strokeRect(x-barWidth/2,y+r+5,barWidth,barHeight);
}

// 미니맵
function drawMinimap(){
    const mx = canvas.width - MINIMAP_SIZE - MINIMAP_PADDING;
    const my = canvas.height - MINIMAP_SIZE - MINIMAP_PADDING;

    // 배경
    ctx.fillStyle = "rgba(0,0,0,0.6)";
    ctx.fillRect(mx, my, MINIMAP_SIZE, MINIMAP_SIZE);
    ctx.strokeStyle = "#fff"; 
    ctx.strokeRect(mx, my, MINIMAP_SIZE, MINIMAP_SIZE);

    const regionX = Math.floor(player.x / REGION_SIZE );
    const regionY = Math.floor(player.y / REGION_SIZE );

    function drawDot(x, y, color, size) {
        // 플레이어 영역 기준 좌표
        const localX = (x - regionX * REGION_SIZE) / REGION_SIZE;
        const localY = (y - regionY * REGION_SIZE) / REGION_SIZE;


        const px = mx + localX * MINIMAP_SIZE;
        const py = my + localY * MINIMAP_SIZE;

        ctx.fillStyle = color;
        ctx.fillRect(px - size/2, py - size/2, size, size);
    }

    // 플레이어 표시
    drawDot(player.x, player.y, "#1e90ff", 6);

    // 활성 청크의 총알/적 표시
    for(const row of chunks){
      for(const chunk of row){
        if(!chunk.active) continue;
        if(chunk.x < regionX * (NUM_CHUNKS/REGION_DIV) || chunk.x >= (regionX+1)*(NUM_CHUNKS/REGION_DIV)) continue;
        if(chunk.y < regionY * (NUM_CHUNKS/REGION_DIV) || chunk.y >= (regionY+1)*(NUM_CHUNKS/REGION_DIV)) continue;
        chunk.bullets.forEach(b => drawDot(b.x, b.y, "#555", 3));
        chunk.enemies.forEach(e => drawDot(e.x, e.y, e.color, 3));
      }
    }
}

// 오브젝트 그리기 --------
  // (불꽃)
function drawPlayerEngines(player) {
    if (!flameReady) return;

    const ship = player.shipData;
    if (!ship.engines) return;

    ctx.save();
    ctx.rotate(player.moveAngle + Math.PI / 2);

    for (const eng of ship.engines) {
        const state = player.engineState[eng.id];
        if (!state.active) continue;

        const frame =
            Math.floor(gameTime * FLAME_FPS * state.power)
            % FLAME_FRAME_COUNT;

        const px = eng.offset.x * player.drawR;
        const py = eng.offset.y * player.drawR;

        const size =
            128 * eng.scale * player.scale * state.power;

        const sx = frame * 128;               // 열 (0~5)
        const sy = eng.flameType * 128;       // 행 (0~3)

        ctx.save();
        ctx.translate(px, py);
        ctx.rotate(eng.angle);

        ctx.drawImage(
            flameImage,
            sx, sy, 128, 128,
            -size / 2, 0,
            size, size
        );

        ctx.restore();
    }

    ctx.restore();
}

  // (플레이어)
function drawPlayer() {
    if (!shipSpriteLoaded) return;

    const ship = player.shipData;
    const s = ship.sheet;

    drawWrapped(player.x, player.y, (x, y) => {
        ctx.save();
        ctx.translate(x, y);

        drawPlayerEngines(player, gameTime);

        // 이동 방향 기준 회전
        ctx.rotate(player.moveAngle + Math.PI / 2);
        // 우주선 이미지가 위쪽을 보고 그려졌을 때 기준

        if (player.hitTime > 0) {
            ctx.globalAlpha = 0.6;
        }

        ctx.drawImage(
            shipSprite,
            s.sx, s.sy, s.sw, s.sh,
            -player.drawR,
            -player.drawR,
            player.drawR * 2,
            player.drawR * 2
        );

        ctx.globalAlpha = 1;
        ctx.restore();

        drawMiniHealthBar(
            x, y,
            player.hitR,
            player.hp,
            getMaxHP(player.shipData, player.level)
        );
    });
}

  // (총알)
function drawBullets() {

    const now = performance.now();

    for (const row of chunks) {
        for (const chunk of row) {

            if (!chunk.active || !chunk.needsUpdate) continue;

            chunk.bullets.forEach(b => {

                drawWrapped(b.x, b.y, (x, y) => {

                    let sx, sy;

                    // 에너지볼(basic)만 애니메이션
                    if (b.sprite === "basic") {

                        const elapsed = (now - b.spawnTime) / 1000;

                        const frame =
                            Math.floor(elapsed / BASIC_ANIM_SPEED) %
                            BASIC_ANIM_FRAMES.length;

                        const sp = BASIC_ANIM_FRAMES[frame];

                        sx = sp.sx * BULLET_SPRITE_SIZE;
                        sy = sp.sy * BULLET_SPRITE_SIZE;

                    }
                    else {

                        const sp = BULLET_SPRITES[b.sprite];

                        sx = sp.sx * BULLET_SPRITE_SIZE;
                        sy = sp.sy * BULLET_SPRITE_SIZE;

                    }

                    // 크기 진동 (basic만)
                    let pulse = 1;
                    if (b.sprite === "basic") {
                        pulse = 1 + Math.sin(now * 0.02 + b.spawnTime * 0.01) * 0.08;
                    }

                    const size = b.drawR * 2 * pulse;

                    ctx.save();

                    ctx.translate(x, y);
                    ctx.rotate(b.angle);
                    ctx.translate(-x, -y);

                    // 빛 번짐 (basic만)
                    if (b.sprite === "basic") {

                        ctx.globalCompositeOperation = "lighter";
                        ctx.globalAlpha = 0.35;

                        const glowSize = size * 1.8;

                        ctx.drawImage(
                            bulletSpriteSheet,
                            sx,
                            sy,
                            BULLET_SPRITE_SIZE,
                            BULLET_SPRITE_SIZE,
                            x - glowSize / 2,
                            y - glowSize / 2,
                            glowSize,
                            glowSize
                        );

                        ctx.globalAlpha = 1;

                    }

                    // 진짜 총알 그리기
                    ctx.drawImage(
                        bulletSpriteSheet,
                        sx,
                        sy,
                        BULLET_SPRITE_SIZE,
                        BULLET_SPRITE_SIZE,
                        x - size / 2,
                        y - size / 2,
                        size,
                        size
                    );

                    ctx.restore();

                });

            });

        }
    }

}

  // (적 도형)
function drawEnemies(){
  for(const row of chunks){
    for(const chunk of row){
      if(!chunk.active || !chunk.needsUpdate) continue;

      chunk.enemies.forEach(e=>{
        drawWrapped(e.x,e.y,(x,y)=>{

          const sprite = SPRITE_MAP_0[e.shape];
          if(!sprite || !enemySpriteSheet_0.complete) return;

          const sx = sprite.fx * FRAME_W_0;
          const sy = sprite.fy * FRAME_H_0;

          const size = e.r * 2;

          ctx.save();

          // 피격 시 깜빡임 효과
          if(e.hitTime > 0){
            ctx.globalAlpha = 0.5;
          }

          ctx.drawImage(
            enemySpriteSheet_0,
            sx, sy, FRAME_W_0, FRAME_H_0,   // 시트에서 자를 위치
            x - size/2, y - size/2,     // 화면 위치
            size, size                  // 화면 크기
          );

          ctx.restore();

          // 미니체력바
          drawMiniHealthBar(
            x, y, e.r,
            e.hp,
            ENEMY_TYPES.find(t=>t.shape===e.shape).hp
          );
        });
      });
    }
  }
}

  // (경험치 옵젝)
function drawXPs(){
    for(const row of chunks){
        for(const chunk of row){
            if(!chunk.active || !chunk.needsUpdate) continue;
            chunk.xps.forEach(xp=>{
                drawWrapped(xp.x, xp.y, (x,y)=>{
                    ctx.fillStyle = "#fff";
                    ctx.beginPath();
                    ctx.arc(x, y, xp.r, 0, Math.PI*2);
                    ctx.fill();
                    ctx.lineWidth = 2;
                    ctx.strokeStyle = "#aaa";
                    ctx.stroke();
                });
            });
        }
    }
}

// 게임 오버 화면(UI)
function drawGameOverPopup(){
    const width = 420;
    const height = 180;

    const x = (canvas.width - width) / 2;
    const y = (canvas.height - height) / 2;

    ctx.fillStyle = "rgba(128,128,128,0.6)";
    ctx.fillRect(x, y, width, height);

    ctx.strokeStyle = "#fff";
    ctx.lineWidth = 2;
    ctx.strokeRect(x, y, width, height);

    ctx.fillStyle = "#fff";
    ctx.font = "18px Arial";
    ctx.textAlign = "center";

    ctx.fillText(
        `Highest Level: ${gameOverData.level}`,
        canvas.width / 2,
        y + 45
    );

    ctx.fillText(
        `XP: ${gameOverData.xp}`,
        canvas.width / 2,
        y + 75
    );

    // 다시하기 버튼
    const btnW = 160;
    const btnH = 40;
    const btnX = canvas.width/2 - btnW/2;
    const btnY = y + 110;

    ctx.fillStyle = "#ff4500"; // 주황빛 빨강
    ctx.fillRect(btnX, btnY, btnW, btnH);

    ctx.strokeStyle = "#fff";
    ctx.strokeRect(btnX, btnY, btnW, btnH);

    ctx.fillStyle = "#fff";
    ctx.font = "16px Arial";
    ctx.textAlign = "center";
    ctx.textBaseline = "middle"; 
    ctx.fillText("REPLAY", canvas.width/2, btnY + btnH/2);

    // 클릭 영역 저장
    replayButton = {x:btnX, y:btnY, w:btnW, h:btnH};
}





// ----------------- [로딩 화면] -----------------
function drawLoading(){
  ctx.fillStyle = "black";
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  ctx.fillStyle = "white";
  ctx.font = "20px Arial";
  ctx.textAlign = "center";
  ctx.textBaseline = "middle";

  ctx.fillText("Loading...", canvas.width/2, canvas.height/2);
}





// ----------------- [로비 랜더링] -----------------
function drawLobby(){
  if (!uiLoaded) return;

  updateScale();

  ctx.clearRect(0,0,canvas.width,canvas.height);

  // 로비 배경
  drawLobbyBackground();

  // 히트박스 설정
  leftBox = makeHitBox(
    canvas.width * 0.5 - px(570),
    canvas.height * 0.5 + px(160),
    px(75),
    px(185)
  );

  rightBox = makeHitBox(
    canvas.width * 0.5 + px(570),
    canvas.height * 0.5 + px(160),
    px(75),
    px(185)
  );

  startBox = makeHitBox(
    canvas.width * 0.5,
    canvas.height * 0.5 + px(305),
    px(350),
    px(75)
  );

  settingBox = makeHitBox(
    canvas.width * 0.5 - px(380),
    canvas.height * 0.5 + px(305),
    px(350),
    px(75)
  );

  howtoBox = makeHitBox(
    canvas.width * 0.5 + px(380),
    canvas.height * 0.5 + px(305),
    px(350),
    px(75)
  );

  // 유리 배경
  drawUI(uiSprite, UI.glass, canvas.width * 0.5, canvas.height * 0.5 - px(185));

  // 카드 (뒤)
  drawCards();

  // 프레임
  drawUI(uiSprite, UI.frame, canvas.width * 0.5, canvas.height * 0.5 + px(185));

  // 버튼
  drawButtons();

  // 좌우 버튼
  drawButton(UI.leftBtn, canvas.width * 0.5 - px(573), canvas.height * 0.5 + px(160), leftBox);
  drawButton(UI.rightBtn, canvas.width * 0.5 + px(573), canvas.height * 0.5 + px(160), rightBox);

  // 로고
  drawUI(uiSprite, UI.logo, canvas.width * 0.5, canvas.height * 0.5 - px(360));

  // 이름창
  drawUI(uiSprite, UI.nameBox, canvas.width * 0.5, canvas.height * 0.5 - px(275));

  // 이름
  drawName();

  // 셋팅 팝업
  drawSettingsPopup();

  // "Click to Start" 팝업창
  drawLobbyPopup()
}





// ----------------- [랜더링] -----------------
function render(){
    currentFOV = Math.min(2, Math.max(0.5, currentFOV));
    ctx.clearRect(0,0,canvas.width,canvas.height);

    updateStarOffset();

    ctx.save();
    ctx.translate(canvas.width / 2, canvas.height / 2);  
    ctx.scale(currentFOV, currentFOV);   // 시야 조절
    ctx.translate(-player.x, -player.y); 

    drawBackground();
    drawBullets();
    if(!isGameOver){
        drawPlayer();
    }
    drawEnemies();
    drawXPs();
    ctx.restore();

    if(!isGameOver){
        drawPlayerName();
        drawPlayerHealthBar();
        drawPlayerEnergyBar(); 
        drawPlayerXPBar(); 
        drawPlayerCredit();
    }
    drawMinimap();
    drawRegionMap();

    if(isGameOver){
        drawGameOverPopup();
    }
}





// ----------------- [게임 루프] -----------------
function loop(){ 
  if (!isAllReady()) {
    drawLoading();
    updateBGM();
    requestAnimationFrame(loop);
    return;
  }

  updateBGM();

  if(lobbyActive){
    drawLobby();
  } else {
    update(); 
    render(); 
  }

  requestAnimationFrame(loop); 
}

loop();
</script>
